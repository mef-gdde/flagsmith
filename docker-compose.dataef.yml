# Compose override file for DataEF stack integration and shared external network
name: ${COMPOSE_PROJECT_NAME:-dataef}

services:
  migrate-db:
    networks:
      - default

  flagsmith:
    networks:
      - default

  flagsmith-task-processor:
    networks:
      - default

  frontend-dev:
    networks:
      - default

networks:
  default:
    name: ${DATAEF_NETWORK_NAME:-dataef-network}
    external: true


