# See https://docs.flagsmith.com/deployment/docker for more information on running Flagsmith in Docker
# This Docker Compose file will run the entire Flagsmith Platform
name: flagsmith

x-flagsmith-service: &flagsmith-service
  image: ${FLAGSMITH_IMAGE:-flagsmith-fork:local}
  build:
    context: .
    target: oss-unified

x-flagsmith-env: &flagsmith-env
  # All environments variables are available here:
  # API: https://docs.flagsmith.com/deployment/locally-api#environment-variables
  # UI: https://docs.flagsmith.com/deployment/locally-frontend#environment-variables

  # Override DATABASE_URL to use an externally managed PostgreSQL database.
  DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@postgres:5432/flagsmith}
  MAX_PROJECTS_IN_FREE_PLAN: ${MAX_PROJECTS_IN_FREE_PLAN:-0}
  USE_POSTGRES_FOR_ANALYTICS: 'true' # Store API and Flag Analytics data in Postgres
  ENVIRONMENT: production # set to 'production' in production.
  DJANGO_ALLOWED_HOSTS: '*' # Change this in production
  FLAGSMITH_DOMAIN: localhost:8000 # Change this in production
  DJANGO_SECRET_KEY: secret # Change this in production
  # PREVENT_SIGNUP: 'true' # Uncomment to prevent any additional signups
  # ALLOW_REGISTRATION_WITHOUT_INVITE: 'true' # Uncomment and set to false to only allow signups via invitations

  # Enable Task Processor
  TASK_RUN_METHOD: TASK_PROCESSOR # other options are: SYNCHRONOUSLY, SEPARATE_THREAD (default)
  PROMETHEUS_ENABLED: 'true'
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CORS_ORIGIN_ALLOW_ALL: 'true'
  PREVENT_SIGNUP: ${PREVENT_SIGNUP:-false}
  PREVENT_EMAIL_PASSWORD: ${PREVENT_EMAIL_PASSWORD:-false}
  PREVENT_FORGOT_PASSWORD: ${PREVENT_FORGOT_PASSWORD:-false}
  PREVENT_OAUTH: ${PREVENT_OAUTH:-false}
  PREVENT_SAML: ${PREVENT_SAML:-false}






  # Uncomment if you want to enable Google OAuth. Note this does not turn Google OAuth on. You still need to use
  # Flagsmith on Flagsmith to enable it - https://docs.flagsmith.com/deployment/#oauth_google
  # DJANGO_SECURE_CROSS_ORIGIN_OPENER_POLICY: 'same-origin-allow-popups'

  # For more info on configuring E-Mails - https://docs.flagsmith.com/deployment/locally-api#environment-variables
  # Example SMTP:
  # EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
  # EMAIL_HOST: mail.example.com
  # SENDER_EMAIL: flagsmith@example.com
  # EMAIL_HOST_USER: flagsmith@example.com
  # EMAIL_HOST_PASSWORD: smtp_account_password
  # EMAIL_PORT: 587 # optional
  # EMAIL_USE_TLS: 'true' # optional

services:
  migrate-db:
    container_name: flagsmith-migrate-db
    <<: *flagsmith-service
    command:
      - migrate
    environment:
      <<: *flagsmith-env
    volumes:
      - ./api:/app
      - /app/.venv
      - /app/__pycache__
    healthcheck:
      disable: true

  flagsmith:
    container_name: flagsmith
    <<: *flagsmith-service
    command:
      - start
      - --reload
      - api
    environment:
      <<: *flagsmith-env
    ports:
      - '${FLAGSMITH_PORT:-8000}:8000'
    volumes:
      - ./api:/app
      - /app/.venv
      - /app/__pycache__
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ./api
          target: /app
          ignore:
            - __pycache__/
            - .venv/
            - .mypy_cache/

  # The flagsmith_processor service is only needed if TASK_RUN_METHOD set to TASK_PROCESSOR
  # in the application environment
  flagsmith-task-processor:
    container_name: flagsmith-task-processor
    <<: *flagsmith-service
    environment:
      <<: *flagsmith-env
    ports:
      - '${FLAGSMITH_TASK_PROCESSOR_PORT:-7778}:8000'
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    command:
      - start
      - --reload
      - task-processor

    volumes:
      - ./api:/app
      - /app/.venv
      - /app/__pycache__
    develop:
      watch:
        - action: sync
          path: ./api
          target: /app
          ignore:
            - __pycache__/
            - .venv/
            - .mypy_cache/

  frontend-dev:
    container_name: flagsmith-frontend-dev
    build:
      context: .
      target: frontend-dev
    command:
      - npm
      - run
      - dev
    ports:
      - '${FRONTEND_PORT:-8080}:8080'
    environment:
      - ENV=local
      - PORT=8080
      - FRONTEND_PORT=${FRONTEND_PORT:-8888}
      - FLAGSMITH_PORT=${FLAGSMITH_PORT:-8005}
      - FLAGSMITH_API_URL=http://localhost:${FLAGSMITH_PORT:-8005}/api/v1/

      - PREVENT_SIGNUP=${PREVENT_SIGNUP:-false}
      - PREVENT_EMAIL_PASSWORD=${PREVENT_EMAIL_PASSWORD:-false}
      - PREVENT_FORGOT_PASSWORD=${PREVENT_FORGOT_PASSWORD:-false}
      - PREVENT_OAUTH=${PREVENT_OAUTH:-false}
      - PREVENT_SAML=${PREVENT_SAML:-false}





    volumes:
      - ./frontend:/srv/bt
      - /srv/bt/node_modules
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /srv/bt
          ignore:
            - node_modules/

networks:
  default:
    name: ${DATAEF_NETWORK_NAME:-dataef-network}
    external: true



